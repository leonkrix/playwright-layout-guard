<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Something is added at the bottom of the page</title>
    <link rel="stylesheet" href="/base.css" />
  </head>
  <body>
    <main>
      <h1>Content</h1>
      <p class="card" id="card">Nothing above this moves, the page just gets longer.</p>
    </main>
    <script>
      window.addEventListener('load', () => {
        setTimeout(() => {
          const footer = document.createElement('footer');
          footer.style.height = '1500px';
          footer.textContent = 'A footer that was loaded late';
          document.body.appendChild(footer);
        }, 150);
      });
    </script>
  </body>
</html>
