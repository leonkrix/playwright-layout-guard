<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A page that writes its document again</title>
  </head>
  <body>
    <main>
      <h1>Before</h1>
    </main>
    <script>
      window.addEventListener('load', () => {
        setTimeout(() => {
          // Until the new content is written, the document has no root element
          document.open();
          setTimeout(() => {
            document.write('<!doctype html><title>After</title><main><h1>After</h1></main>');
            document.close();
          }, 150);
        }, 100);
      });
    </script>
  </body>
</html>
