<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A panel that opens when asked for</title>
    <link rel="stylesheet" href="/base.css" />
  </head>
  <body>
    <main>
      <details id="panel">
        <summary id="summary">More</summary>
        <p>Some more text that pushes the card below down when the panel is open.</p>
        <p>And a second paragraph.</p>
      </details>
      <p class="card" id="card">The card below the panel.</p>
    </main>
  </body>
</html>
