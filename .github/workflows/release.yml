name: Release

# A release is a tag: after the version commit (`pnpm version-packages`, from the changesets) is on main,
# `git tag v0.2.0 && git push origin v0.2.0`. See docs/releasing.md.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # contents: the release notes. id-token: npm trusted publishing and provenance (OIDC)
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      - name: The tag must match the version in package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "v$VERSION" != "$TAG" ]; then
            echo "Tag $TAG does not match the version $VERSION in package.json"
            exit 1
          fi

      - uses: ./.github/actions/setup-browsers
        with:
          browsers: chromium firefox webkit

      - name: Full check before anything is published
        run: |
          pnpm lint
          pnpm format:check
          pnpm typecheck
          pnpm test:unit
          pnpm build
          pnpm lint:package
          pnpm test

      # npm trusted publishing: no token is stored anywhere. The package names this repository and
      # this workflow in its npm settings (docs/releasing.md)
      - name: Publish
        run: npm publish --provenance --access public

      - name: GitHub release with the notes of this version
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          # The section of CHANGELOG.md for this version, without its heading
          awk -v v="$VERSION" '
            $0 ~ "^## " v "( |$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "Version $VERSION on npm." > notes.md; fi
          FLAGS=""
          case "$VERSION" in *-*) FLAGS="--prerelease" ;; esac
          gh release create "$TAG" --title "$TAG" --notes-file notes.md $FLAGS
