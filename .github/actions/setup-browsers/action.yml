name: Set up Playwright browsers
description: Installs browsers and their system libraries, with a cache for the browser downloads and a retry for the system packages

inputs:
  browsers:
    description: Space separated browsers, for example "chromium firefox webkit"
    required: true

runs:
  using: composite
  steps:
    # The download of the browsers is cached per Playwright version (the lockfile changes with it).
    # The system libraries come from apt and are installed every time.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ inputs.browsers }}-${{ hashFiles('pnpm-lock.yaml') }}

    # The apt mirrors of the runners sometimes stall for minutes (seen with the WebKit packages), so
    # every attempt has its own time limit and a stalled one is tried again
    - name: Install browsers and system libraries
      shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
      run: |
        for attempt in 1 2 3; do
          if timeout 360 pnpm exec playwright install --with-deps $BROWSERS; then
            exit 0
          fi
          echo "Attempt $attempt did not finish, trying again"
        done
        echo "The browsers could not be installed"
        exit 1
